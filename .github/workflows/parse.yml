name: parse
# Reparse the already-harvested corpus. No network, no refetching.
# This is the workflow you run after a parser change -- it is the whole point of
# keeping harvest and parse separate.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Parse
        run: python scripts/parse_qol.py
      - name: Score the parser against fixtures
        continue-on-error: true
        run: python scripts/test_parser.py
      - name: Commit
        run: |
          git config user.name  "prefsdb-bot"
          git config user.email "prefsdb-bot@users.noreply.github.com"
          git add data/facts.csv
          git diff --staged --quiet || git commit -m "reparse corpus"
          git push
